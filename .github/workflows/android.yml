name: Build GameMela Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

concurrency:
  group: gamemela-android-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Get packages
        run: flutter pub get
      - name: Create Android platform files
        run: |
          flutter create --platforms=android --org com.gamemela --project-name puzzleracing .
          sed -i 's/android:label="[^"]*"/android:label="GameMela"/' android/app/src/main/AndroidManifest.xml
          sed -i '/<application/a\        <meta-data android:name="com.google.android.gms.ads.APPLICATION_ID" android:value="ca-app-pub-3940256099942544~3347511713" />' android/app/src/main/AndroidManifest.xml
          sed -i 's/minSdk = flutter.minSdkVersion/minSdk = 23/' android/app/build.gradle.kts
      - name: Run tests
        run: flutter test
      - name: Analyze
        run: flutter analyze
      - name: Build debug APK
        run: flutter build apk --debug
      - name: Rename APK
        run: cp build/app/outputs/flutter-apk/app-debug.apk GameMela.apk
      - uses: actions/upload-artifact@v4
        with:
          name: GameMela-Android-debug
          path: GameMela.apk
          retention-days: 14
