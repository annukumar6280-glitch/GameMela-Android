name: Build GameMela Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

concurrency:
  group: gamemela-android-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Get packages
        run: flutter pub get
      - name: Create Android platform files
        run: flutter create --platforms=android --project-name game_mela .
      - name: Analyze
        run: flutter analyze
      - name: Build debug APK
        run: flutter build apk --debug
      - name: Rename APK
        run: cp build/app/outputs/flutter-apk/app-debug.apk GameMela.apk
      - uses: actions/upload-artifact@v4
        with:
          name: GameMela-Android-debug
          path: GameMela.apk
          retention-days: 14
