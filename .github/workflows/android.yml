name: Build GameMela Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

concurrency:
  group: gamemela-android-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Get packages
        run: flutter pub get
      - name: Create Android platform files
        run: |
          flutter create --platforms=android --org com.gamemela --project-name puzzleracing .
          python3 - <<'PY'
          import xml.etree.ElementTree as ET
          manifest = "android/app/src/main/AndroidManifest.xml"
          android_ns = "http://schemas.android.com/apk/res/android"
          ET.register_namespace("android", android_ns)
          tree = ET.parse(manifest)
          app = tree.getroot().find("application")
          if app is None:
              raise SystemExit("Android manifest has no application element")
          app.set(f"{{{android_ns}}}label", "GameMela")
          app.findall("meta-data")
          for item in list(app):
              if item.tag == "meta-data" and item.get(f"{{{android_ns}}}name") == "com.google.android.gms.ads.APPLICATION_ID":
                  app.remove(item)
          ET.SubElement(app, "meta-data", {
              f"{{{android_ns}}}name": "com.google.android.gms.ads.APPLICATION_ID",
              f"{{{android_ns}}}value": "ca-app-pub-9742595266312511~1432787462"
          })
          tree.write(manifest, encoding="utf-8", xml_declaration=True)
          ET.parse(manifest)
          PY
          sed -i 's/minSdk = flutter.minSdkVersion/minSdk = 23/' android/app/build.gradle.kts
      - name: Run tests
        run: flutter test
      - name: Analyze
        run: flutter analyze
      - name: Build debug APK
        run: flutter build apk --debug
      - name: Rename APK
        run: cp build/app/outputs/flutter-apk/app-debug.apk GameMela.apk
      - uses: actions/upload-artifact@v4
        with:
          name: GameMela-Android-debug
          path: GameMela.apk
          retention-days: 14
