name: Validate GameMela 3D Bike Game

on:
  workflow_dispatch:
  push:
    branches: [ feature/3d-bike-simulator ]
    paths:
      - 'bike_simulator/**'
      - '.github/workflows/godot-bike-check.yml'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Godot 4.3
        run: |
          wget -q https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_linux.x86_64.zip
          unzip -q Godot_v4.3-stable_linux.x86_64.zip
          chmod +x Godot_v4.3-stable_linux.x86_64
          sudo mv Godot_v4.3-stable_linux.x86_64 /usr/local/bin/godot
      - name: Import and parse project
        run: |
          godot --headless --editor --path bike_simulator --quit 2>&1 | tee /tmp/godot-import.log
          ! grep -E "SCRIPT ERROR|Parse Error|ERROR: Failed to load script" /tmp/godot-import.log
      - name: Run 3D scene headlessly
        run: |
          godot --headless --path bike_simulator --quit-after 10 2>&1 | tee /tmp/godot-run.log
          ! grep -E "SCRIPT ERROR|Parse Error|ERROR: Failed to load script" /tmp/godot-run.log
