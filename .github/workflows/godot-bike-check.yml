name: Validate and Build GameMela 3D Bike Prototype

on:
  workflow_dispatch:
  push:
    branches: [ feature/3d-bike-simulator ]
    paths:
      - 'bike_simulator/**'
      - '.github/workflows/godot-bike-check.yml'

jobs:
  validate-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Godot 4.3
        run: |
          wget -q https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_linux.x86_64.zip
          unzip -q Godot_v4.3-stable_linux.x86_64.zip
          chmod +x Godot_v4.3-stable_linux.x86_64
          sudo mv Godot_v4.3-stable_linux.x86_64 /usr/local/bin/godot

      - name: Import and parse project
        run: godot --headless --editor --path bike_simulator --quit

      - name: Run 3D scene headlessly
        run: godot --headless --path bike_simulator --quit-after 10

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Install matching Godot Android export templates
        run: |
          wget -q https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_export_templates.tpz
          mkdir -p "$HOME/.local/share/godot/export_templates/4.3.stable"
          mkdir -p "$RUNNER_TEMP/godot-templates"
          unzip -q Godot_v4.3-stable_export_templates.tpz -d "$RUNNER_TEMP/godot-templates"
          cp -R "$RUNNER_TEMP/godot-templates/templates/." "$HOME/.local/share/godot/export_templates/4.3.stable/"
          test -s "$HOME/.local/share/godot/export_templates/4.3.stable/android_debug.apk"

      - name: Configure Godot Android export settings
        run: |
          mkdir -p "$HOME/.android" "$HOME/.config/godot"
          keytool -keyalg RSA -genkeypair -alias androiddebugkey -keypass android -keystore "$HOME/.android/debug.keystore" -storepass android -dname "CN=Android Debug,O=Android,C=US" -validity 9999
          cat > "$HOME/.config/godot/editor_settings-4.tres" <<EOF
          [gd_resource type="EditorSettings" format=3]
          [resource]
          export/android/android_sdk_path = "$ANDROID_HOME"
          export/android/java_sdk_path = "$JAVA_HOME"
          export/android/debug_keystore = "$HOME/.android/debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          EOF

      - name: Export Android APK
        run: |
          godot --headless --path bike_simulator --export-debug "Android" bike_simulator/GameMela-Bike-Prototype.apk
          test -s bike_simulator/GameMela-Bike-Prototype.apk

      - name: Upload test APK
        uses: actions/upload-artifact@v4
        with:
          name: GameMela-3D-Bike-Prototype-APK
          path: bike_simulator/GameMela-Bike-Prototype.apk
          retention-days: 14
